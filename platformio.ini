; ============================================================================
; Project metadata (single source of truth for version)
; ============================================================================
[common]
project_name = rda_msg_board
version = v1.3.1

; ============================================================================
; Common settings shared by all environments
; ============================================================================
[env]
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    majicdesigns/MD_MAX72XX@^3.5.1
    majicdesigns/MD_Parola@^3.7.5
    tzapu/WiFiManager@^2.0.17
    evert-arias/EasyButton@^2.0.3
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8

; Common build flags (environments can add to these)
build_flags =
    -Wno-cpp
    -Wno-sign-compare   ; Suppress PubSubClient signed/unsigned comparison warning (third-party)
    -DMQTT_MAX_PACKET_SIZE=1024
    ; -DDEBUG=1

; ============================================================================
; CI Build environments (for GitHub Actions - 4 and 8 module variants)
; ============================================================================
[env:nodemcu_4m]
board = nodemcuv2
build_flags =
    ${env.build_flags}
    -DVERSION=\"${common.version}-nodemcu\"
    -DMAX_DEVICES=4
    ; --- Pin Configuration ---
    ; ESP8266 specific pins with 4 modules (uncomment to override config.h defaults)
    ; -DCLK_PIN=D5
    ; -DDATA_PIN=D7
    -DCS_PIN=D8
    ; -DBUZZER_PIN=D1
    ; --- Modular Features ---
    ; Uncomment to disable features to save memory/flash space
    ; -DDISABLE_SLEEP_MODE_FEATURE
    ; -DDISABLE_TIMER_FEATURE
    -DDISABLE_WEATHER_FEATURE
    ; -DDISABLE_ALARM_FEATURE
    -DDISABLE_CRYPTO_FEATURE  ; ESP8266: crypto requires HTTPS (ESP32 only) and heap is too tight
    -DDISABLE_HA_CLOCK_ADVANCED  ; ESP8266: skip verbose HA clock entities to reduce heap pressure
    ; -DDEBUG=1

[env:nodemcu_8m]
board = nodemcuv2
build_flags =
    ${env.build_flags}
    -DVERSION=\"${common.version}-nodemcu\"
    -DMAX_DEVICES=8
    ; --- Pin Configuration ---
    ; ESP8266 nodemcu specific pins with 8 modules (uncomment to override config.h defaults)
    ; -DCLK_PIN=D5
    ; -DDATA_PIN=D7
    -DCS_PIN=D8
    ; -DBUZZER_PIN=D1
    ; --- Modular Features ---
    ; Uncomment to disable features to save memory/flash space
    ; -DDISABLE_SLEEP_MODE_FEATURE
    ; -DDISABLE_TIMER_FEATURE
    -DDISABLE_WEATHER_FEATURE
    ; -DDISABLE_ALARM_FEATURE
    -DDISABLE_CRYPTO_FEATURE  ; ESP8266: crypto requires HTTPS (ESP32 only) and heap is too tight
    -DDISABLE_HA_CLOCK_ADVANCED  ; ESP8266: skip verbose HA clock entities to reduce heap pressure
    ; -DDEBUG=1

[env:d1_mini_4m]
board = d1_mini
build_flags =
    ${env.build_flags}
    -DVERSION=\"${common.version}-d1_mini\"
    -DMAX_DEVICES=4
    ; --- Pin Configuration ---
    ; ESP8266 D1 Mini specific pins with 4 modules (uncomment to override config.h defaults)
    ; -DCLK_PIN=D5
    ; -DDATA_PIN=D7
    -DCS_PIN=D4          ; My office D1_mini uses D4
    -DBUZZER_PIN=D1      ; Standard buzzer pin
    ; --- Modular Features ---
    ; Uncomment to disable features to save memory/flash space
    ; -DDISABLE_SLEEP_MODE_FEATURE
    ; -DDISABLE_TIMER_FEATURE
    -DDISABLE_WEATHER_FEATURE
    ; -DDISABLE_ALARM_FEATURE
    -DDISABLE_CRYPTO_FEATURE  ; ESP8266: crypto requires HTTPS (ESP32 only) and heap is too tight
    -DDISABLE_HA_CLOCK_ADVANCED  ; ESP8266: skip verbose HA clock entities to reduce heap pressure
    ; -DDEBUG=1

[env:d1_mini_8m]
board = d1_mini
build_flags =
    ${env.build_flags}
    -DVERSION=\"${common.version}-d1_mini\"
    -DMAX_DEVICES=8
    ; --- Pin Configuration ---
    ; ESP8266 D1 Mini specific pins with 8 modules (uncomment to override config.h defaults)
    ; -DCLK_PIN=D5
    ; -DDATA_PIN=D7
    -DCS_PIN=D4          ; My office D1_mini uses D4
    -DBUZZER_PIN=D1      ; Standard buzzer pin
    ; --- Modular Features ---
    ; Uncomment to disable features to save memory/flash space
    ; -DDISABLE_SLEEP_MODE_FEATURE
    ; -DDISABLE_TIMER_FEATURE
    -DDISABLE_WEATHER_FEATURE
    ; -DDISABLE_ALARM_FEATURE
    -DDISABLE_CRYPTO_FEATURE  ; ESP8266: crypto requires HTTPS (ESP32 only) and heap is too tight
    -DDISABLE_HA_CLOCK_ADVANCED  ; ESP8266: skip verbose HA clock entities to reduce heap pressure
    ; -DDEBUG=1

; ============================================================================
; ESP32 CI Build environments (for GitHub Actions - 4 and 8 module variants)
; ============================================================================
[env:esp32_4m]
platform = espressif32@^6.5.0
board = esp32dev
board_build.partitions = min_spiffs.csv  ; ~1.9MB app with OTA, 190KB filesystem
lib_ldf_mode = chain+
lib_ignore = EasyButton  ; Temporarily ignore - has ESP32 dependency issues when ENABLE_FLASH_BUTTON=0
build_flags =
    ${env.build_flags}
    -DVERSION=\"${common.version}-esp32\"
    -DMAX_DEVICES=4
    ; --- System Optimization ---
    ; Size optimization flags
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -DCORE_DEBUG_LEVEL=0
    ; --- Pin Configuration ---
    ; ESP32 uses standard VSPI pins (GPIO 18=CLK, 23=MOSI, 5=CS, 4=Buzzer)
    ; Uncomment below to override config.h defaults
    -DCLK_PIN=18
    -DDATA_PIN=23
    -DCS_PIN=5
    -DBUZZER_PIN=4
    ; --- Modular Features ---
    ; Uncomment to disable features to save memory/flash space
    ; -DDISABLE_SLEEP_MODE_FEATURE
    ; -DDISABLE_TIMER_FEATURE
    ; -DDISABLE_WEATHER_FEATURE
    ; -DDISABLE_ALARM_FEATURE
    ; -DDISABLE_CRYPTO_FEATURE  ; Uncomment to disable crypto price ticker (saves ~10KB flash)
    ; -DDEBUG=1

[env:esp32_8m]
platform = espressif32@^6.5.0
board = esp32dev
board_build.partitions = min_spiffs.csv  ; ~1.9MB app with OTA, 190KB filesystem
lib_ldf_mode = chain+
lib_ignore = EasyButton  ; Temporarily ignore - has ESP32 dependency issues when ENABLE_FLASH_BUTTON=0
build_flags =
    ${env.build_flags}
    -DVERSION=\"${common.version}-esp32\"
    -DMAX_DEVICES=8
    ; --- System Optimization ---
    ; Size optimization flags
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -DCORE_DEBUG_LEVEL=0
    ; --- Pin Configuration ---
    ; ESP32 uses standard VSPI pins (GPIO 18=CLK, 23=MOSI, 5=CS, 4=Buzzer)
    ; Uncomment below to override config.h defaults
    -DCLK_PIN=18
    -DDATA_PIN=23
    -DCS_PIN=5
    -DBUZZER_PIN=4
    ; --- Modular Features ---
    ; Uncomment to disable features to save memory/flash space
    ; -DDISABLE_SLEEP_MODE_FEATURE
    ; -DDISABLE_TIMER_FEATURE
    ; -DDISABLE_WEATHER_FEATURE
    ; -DDISABLE_ALARM_FEATURE
    ; -DDISABLE_CRYPTO_FEATURE  ; Uncomment to disable crypto price ticker (saves ~10KB flash)
    ; -DDEBUG=1